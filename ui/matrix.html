<!-- Connection Monitoring -->
<script src="/ui/dialogs.js?v=1"></script>
<script src="/ui/settings.js?v=1"></script>
  <script src="/ui/adminnav.js"></script>
<script>
let connectionCheckInterval = null;
let heartbeatInterval = null;
let lastSuccessfulHeartbeat = Date.now();
let heartbeatInFlight = false;
let consecutiveHeartbeatFailures = 0;
const CONNECTION_TIMEOUT_MS = 15000;
const HEARTBEAT_INTERVAL_MS = 5000;
const HEARTBEAT_REQUEST_TIMEOUT_MS = 3000;
const HEARTBEAT_FAILURE_LIMIT = 3;

// The persistent "connection lost" banner is gone. The heartbeat still records reachability in
// window.__lumaConnection for diagnostics; an operation that really fails reports its own error.
function showConnectionBanner() { window.__lumaConnection = {reachable:false, since:Date.now()}; }
function hideConnectionBanner() { window.__lumaConnection = {reachable:true, since:Date.now()}; }

function startConnectionMonitoring() {
  if(heartbeatInterval) return;
  
  const checkHeartbeat = async () => {
    if(heartbeatInFlight) return;
    heartbeatInFlight = true;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), HEARTBEAT_REQUEST_TIMEOUT_MS);
    try {
      const response = await fetch('/api/heartbeat', { cache: 'no-store', signal: controller.signal });
      if(response.ok) {
        lastSuccessfulHeartbeat = Date.now();
        consecutiveHeartbeatFailures = 0;
        hideConnectionBanner();
      } else {
        consecutiveHeartbeatFailures++;
      }
    } catch(e) {
      consecutiveHeartbeatFailures++;
    } finally {
      clearTimeout(timeout);
      heartbeatInFlight = false;
    }
  };

  checkHeartbeat();
  heartbeatInterval = setInterval(checkHeartbeat, HEARTBEAT_INTERVAL_MS);
  
  // Check if heartbeat has stalled
  if(connectionCheckInterval) return;
  connectionCheckInterval = setInterval(async () => {
    const timeSinceLastSuccess = Date.now() - lastSuccessfulHeartbeat;
    if(timeSinceLastSuccess > CONNECTION_TIMEOUT_MS && consecutiveHeartbeatFailures >= HEARTBEAT_FAILURE_LIMIT) {
      showConnectionBanner();
    }
  }, 2000);
}

function stopConnectionMonitoring() {
  if(heartbeatInterval) {
    clearInterval(heartbeatInterval);
    heartbeatInterval = null;
  }
  if(connectionCheckInterval) {
    clearInterval(connectionCheckInterval);
    connectionCheckInterval = null;
  }
}

const originalFetch = window.fetch;
window.fetch = async function(...args) {
  // Just pass through - heartbeat is handled separately
  try {
    const response = await originalFetch.apply(this, args);
    return response;
  } catch(e) {
    throw e;
  }
};

window.onbeforeunload = () => {
  stopConnectionMonitoring();
};

startConnectionMonitoring();
</script>

<!-- Footer with version -->
<footer style="position:fixed; bottom:0; left:0; right:0; padding:8px 16px; border-top:1px solid var(--border); background:var(--card); font-size:11px; color:var(--muted); text-align:right; z-index:999; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
  LumaSuite <span id="app_version" style="font-weight:500;">v?.?.?</span>
</footer>

<script>
  // Fetch and display app version
  (function(){
    const versionEl = document.getElementById('app_version');
    fetch('/api/app_version')
      .then(r => {
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(d => {
        if(d && d.ok && d.version){
          versionEl.textContent = 'v' + d.version;
        } else {
          versionEl.textContent = 'v?.?.?';
        }
      })
      .catch(e => {
        console.warn('[Version] Fetch failed:', e);
        versionEl.textContent = 'v?.?.?';
      });
  })();
</script>
