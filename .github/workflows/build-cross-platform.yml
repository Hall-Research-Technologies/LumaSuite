name: Build Cross Platform

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # Decides what this run is before anything is built. Fails closed. A branch push or a manual dispatch
  # is a diagnostic build and can never publish; a tag run must be exactly v<version> on origin/main.
  identity:
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.guard.outputs.publishable }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release identity guard
        id: guard
        shell: bash
        run: |
          git fetch origin main --depth=1000 || true
          python3 tools/release_guard.py identity

  # SUPPORTED DISTRIBUTED PLATFORMS: Windows x86_64 and macOS Apple Silicon (arm64), and only those.
  # No macOS Intel, no Linux, no universal binary: nothing is built, tested, named or published for
  # them. Each row below is both the TEST RUNNER (the full suite runs on it) and the platform that is
  # DISTRIBUTED from it. The identity and publish jobs run on ubuntu-latest purely as an orchestration
  # runner: they run this repository's own scripts and ship nothing that was built there.
  build:
    needs: identity
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            mac_arch: ""
            artifact_name: LumaSuite-Windows-x86_64
          # macos-15 is a native Apple Silicon (arm64) runner. It is named rather than floating so that
          # a label can never move this row to Intel; the architecture is asserted in the steps below.
          - os: macos-15
            platform: macOS
            mac_arch: arm64
            artifact_name: LumaSuite-macOS-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require the architecture this row claims
        shell: bash
        run: |
          echo "runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
          case "${{ runner.os }}-${{ runner.arch }}" in
            Windows-X64|macOS-ARM64) ;;
            *) echo "::error::LumaSuite is built for Windows x86_64 or macOS arm64 only; got ${{ runner.os }} ${{ runner.arch }}"; exit 1 ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tag must be v plus the application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys
          source = open("lumaserver.py", encoding="utf-8").read()
          match = re.search(r'^__version__ = "([^"]+)"', source, re.M)
          expected = "v" + match.group(1) if match else None
          tag = os.environ["TAG_NAME"]
          if tag != expected:
              sys.exit("Tag %r does not match the application version %r" % (tag, expected))
          print("Tag", tag, "matches the application version")
          PY

      - name: The interpreter is the architecture this row claims
        shell: bash
        run: |
          python -c "import platform, sys; print('python', sys.version); print('machine', platform.machine())"
          python -c "import sysconfig; print('python platform:', sysconfig.get_platform())"
          if [ "${{ runner.os }}" = "macOS" ]; then
            test "$(uname -m)" = "arm64" || { echo "::error::macOS runner is not arm64: $(uname -m)"; exit 1; }
            # A universal2 or x86_64 interpreter would build a non-arm64 app under an arm64 name.
            python -c "import platform, sys; sys.exit(0 if platform.machine() == 'arm64' else 1)" || { echo "::error::the Python interpreter is not arm64"; exit 1; }
            python -c "import sysconfig, sys; p = sysconfig.get_platform(); sys.exit(1 if ('universal2' in p or 'x86_64' in p) else 0)" || { echo "::error::the interpreter is universal2 or x86_64"; exit 1; }
          else
            python -c "import platform, sys; sys.exit(0 if platform.machine().lower() in ('amd64', 'x86_64') else 1)" || { echo "::error::the Windows interpreter is not x86-64"; exit 1; }
          fi

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build-lock.txt
          # The runner's own Python can carry packages that are not in the lock. PyInstaller bundles
          # whatever an imported module can reach, and colorama (a BSD-licensed click helper) reached the
          # packaged executable that way: not locked, not in the notices, absent from the qualified build.
          # Removing it restores the locked set; it is not a dependency of the product.
          python -m pip uninstall -y colorama

      - name: Validate Python
        shell: bash
        run: python -m py_compile lumaserver.py producer2_routes.py app_launcher.py build_executable.py luma_access.py luma_adapters.py luma_aliases.py luma_audit_text.py luma_backup.py luma_breakaway.py luma_destinations.py luma_gate.py luma_groups.py luma_inventory.py luma_liveness.py luma_locks.py luma_netstatus.py luma_portcontrol.py luma_previewstats.py luma_thumbnail.py luma_projection.py luma_remote.py luma_remote_api.py luma_retention.py luma_scanplan.py luma_secret.py luma_statecache.py luma_store.py luma_tls.py luma_user_matrix.py luma_users.py luma_walls.py luma_wiring.py luma_mac.py luma_request.py luma_topology.py luma_logging.py

      - name: Python backend tests (hardware-fenced)
        shell: bash
        run: |
          # CI runner accommodation, test steps only. On the hosted macOS runners resolving the
          # machine's own name takes about 35 s per fresh process, and the HTTP server library
          # resolves it while binding, so a launcher scenario waits for a server that is only
          # parked in a name lookup. The shim, kept outside the repository and never packaged,
          # answers that one lookup without a query; nothing else about the process changes.
          if [ "$RUNNER_OS" = "macOS" ]; then
            shim="$RUNNER_TEMP/ci_resolver_shim"; mkdir -p "$shim"
            cat > "$shim/sitecustomize.py" <<'PYEOF'
          import socket as _socket, sys as _sys
          _real_getfqdn = _socket.getfqdn
          def getfqdn(name=""):
              if name in ("", "0.0.0.0", "::", "127.0.0.1", "::1", "localhost"):
                  return name or "localhost"
              return _real_getfqdn(name)
          _socket.getfqdn = getfqdn
          print("[ci] resolver shim active", file=_sys.stderr)
          PYEOF
            export PYTHONPATH="$shim${PYTHONPATH:+:$PYTHONPATH}"
          fi
          python tests/test_password_fallback.py
          python tests/test_credential_recovery.py
          python tests/test_video_wall_regions.py
          python tests/test_video_wall_detection.py
          python tests/test_video_wall_zones.py
          python tests/test_video_wall_mode.py
          python tests/test_video_wall_candidates.py
          python tests/test_hall_firmware_status.py
          python tests/test_access_fence.py
          python tests/test_remote_security.py
          python tests/test_remote_body_limit.py
          python tests/test_user_routing.py
          python tests/test_display_groups.py
          python tests/test_route_verification.py
          python tests/test_route_parallel.py
          python tests/test_server_hardening.py
          python tests/test_remote_access_api.py
          python tests/test_direct_access_address.py
          python tests/test_certificate_identity.py
          python tests/test_working_credential.py
          python tests/test_frontend_contract.py
          python tests/test_fence.py
          python tests/test_preview_proxy.py
          python tests/test_host_header.py
          python tests/test_remote_config_paths.py
          python tests/test_backup_kdf_bounds.py
          python tests/test_throttle_bounds.py
          python tests/test_group_scale.py
          python tests/test_group_integrity.py
          python tests/test_reach_rescan.py
          python tests/test_restore_cache_race.py
          python tests/test_restore_lock_order.py
          python tests/test_group_property.py
          python tests/test_store_read_errors.py
          python tests/test_mutation_lock.py
          python tests/test_remote_destinations.py
          python tests/test_restore_atomicity.py
          python tests/test_unification.py
          python tests/test_device_manager_parity.py
          python tests/test_luma_netstatus.py
          python tests/test_switch_topology.py
          python tests/test_switch_topology_gate.py
          python tests/test_switch_topology_lifecycle.py
          python tests/test_thumbnail.py
          python tests/test_firmware_check_now.py
          python tests/test_user_multi.py
          python tests/test_user_unroute.py
          python tests/test_unroute_engine.py
          python tests/test_user_walls.py
          python tests/test_user_matrix.py
          python tests/test_account_lifecycle.py
          python tests/test_route_matrix.py
          python tests/test_clear_assigned.py
          python tests/test_clear_lag.py
          python tests/test_detail_batch.py
          python tests/test_clear_no_resurrection.py
          python tests/test_log_volume.py
          python tests/test_restore_failure_stages.py
          python tests/test_night_inventory.py
          python tests/test_secrets_hammer.py
          python tests/test_remove_selected.py
          python tests/test_restore_sessions.py
          python tests/test_backup_rules.py
          python tests/test_remote_matrix_integration.py
          python tests/test_matrix_latency.py
          python tests/test_matrix_adversarial.py
          python tests/test_routing_torture.py
          python tests/test_user_av_convergence.py
          python tests/test_admin_matrix_poll.py
          python tests/test_switcher_poll.py
          python tests/test_offline_polling.py
          python tests/test_state_text_contrast.py
          python tests/test_local_port.py
          python tests/test_launcher_port.py
          python tests/test_release_consistency.py
          python tests/test_user_guide_assets.py
          python tests/test_dependency_hygiene.py
          python tests/test_notices.py
          python tests/test_update_assets.py
          python tests/test_request_bodies.py
          python tests/test_mac_shape.py
          python tests/test_remote_listener_hardening.py
          python tests/test_log_hygiene.py
          python tests/test_update_production_identity.py
          python tests/test_release_guard.py
          python tests/test_inspect_release.py
          python tests/test_platform_matrix.py
          python tests/test_updater_proof.py
          python tests/test_private_paths.py
          python tests/test_licence_package.py
          python tests/test_route_states.py

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check ui/wall.js
          node --check ui/producer.js
          node --check ui/dialogs.js
          node --check ui/settings.js
          node --check ui/user.js
          node --check ui/login.js
          node --check ui/csrf.js
          node --check ui/remember.js
          node --check ui/adminnav.js
          node --check ui/admin_users.js
          node --check ui/remote_settings.js
          node --check ui/port_settings.js
          node --check ui/clear_units.js
          node tests/video_wall_model.test.js
          node tests/video_wall_preview_refresh.test.js
          node tests/video_wall_route_mode_test.js
          node tests/producer_logo_position.test.js
          node tests/producer_logo_controls.test.js
          node tests/no_native_dialogs.test.js
          node tests/shell_family_consistency.test.js
          node tests/admin_walls_test.js
          node tests/user_page_test.js
          node tests/user_matrix_page_test.js
          node tests/user_focus_test.js
          node tests/user_route_states_test.js
          node tests/admin_routing_interface_test.js
          node tests/remote_pages_test.js
          node tests/light_background_test.js
          node tests/form_control_baseline_test.js
          node tests/port_settings_test.js
          node tests/unification_test.js
          node tests/matrix_indicator_test.js
          node tests/nav_stability_test.js
          node tests/preview_checkbox_test.js
          node tests/unit_preview_test.js
          node tests/firmware_check_test.js
          node tests/dialog_field_test.js
          node tests/clear_units_test.js
          node tests/clear_lag_test.js
          node tests/detail_batch_test.js
          node tests/clear_stale_route_test.js
          node tests/remove_selected_test.js
          node tests/settings_parity_test.js
          node tests/device_table_test.js
          node tests/switch_topology_test.js

      - name: Build Windows
        if: runner.os == 'Windows'
        run: python build_executable.py windows

      - name: Inspect the Windows executable (notices present, no private content)
        if: runner.os == 'Windows'
        shell: bash
        run: python tools/release_guard.py inspect-exe dist/Windows/LumaSuite.exe

      - name: Build macOS (Apple Silicon only)
        if: runner.os == 'macOS'
        env:
          PYI_MACOS_ARCH: ${{ matrix.mac_arch }}
        run: python build_executable.py macos

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/Windows/LumaSuite.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/macOS/*.app

      - name: Upload Windows warning log
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: warn-${{ matrix.artifact_name }}
          path: build/Windows/LumaSuite/warn-LumaSuite.txt
          if-no-files-found: ignore

      - name: Upload macOS warning log
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: warn-${{ matrix.artifact_name }}
          path: build/macOS/LumaSuite/warn-LumaSuite.txt
          if-no-files-found: ignore

      - name: Verify the Windows executable is x86-64
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import struct, sys
          data = open("dist/Windows/LumaSuite.exe", "rb").read(4096)
          offset = struct.unpack_from("<I", data, 0x3C)[0]
          machine = struct.unpack_from("<H", data, offset + 4)[0]
          print("PE machine type: 0x%04x" % machine)
          sys.exit(0 if machine == 0x8664 else "expected x86-64 (0x8664)")
          PY

      # The macOS package must be Apple Silicon and nothing else: no universal binary, no x86_64
      # slice anywhere in the bundle. `lipo -archs` and `file` on the launcher, a header walk over
      # every Mach-O file in the bundle AND in the zip that is distributed, the bundle identity and
      # the signature state. NOT YET RUN: this was written on Windows, where macOS cannot be built;
      # the first macOS CI run is its first execution.
      - name: Verify the macOS bundle is arm64 only
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/macOS/LumaSuite.app"
          bin="$app/Contents/MacOS/LumaSuite"
          test -d "$app" || { echo "::error::no app bundle at $app"; exit 1; }
          test -x "$bin" || { echo "::error::launcher is missing or not executable: $bin"; exit 1; }
          test -f "$app/Contents/Info.plist" || { echo "::error::no Info.plist"; exit 1; }
          file "$bin"
          archs="$(lipo -archs "$bin")"
          echo "lipo -archs: $archs"
          test "$archs" = "arm64" || { echo "::error::expected exactly arm64, lipo says: $archs"; exit 1; }
          if file "$bin" | grep -qiE "universal|x86_64"; then
            echo "::error::the launcher is universal or carries x86_64"
            exit 1
          fi
          # Every Mach-O in the bundle, not only the launcher: a bundled library with an x86_64
          # slice is an Intel binary inside an arm64 package.
          python tools/verify_macho_arch.py --path "$app" --expect arm64
          python tools/verify_macho_arch.py --bundle-identity "$app"
          # Signature state, stated exactly: the bundle is signed AD HOC (the build signs it again
          # after stamping Info.plist). It is NOT Developer ID signed and NOT notarized, and
          # Gatekeeper is expected to refuse a double-click until the operator allows it (README).
          codesign --verify --deep --strict "$app"
          sig="$(codesign -dvv "$app" 2>&1)"
          echo "$sig"
          echo "$sig" | grep -q "Signature=adhoc" || { echo "::error::expected an ad hoc signature; this build is not meant to be Developer ID signed"; exit 1; }
          if echo "$sig" | grep -q "Authority="; then echo "::error::a signing authority is present; the documentation says this build is ad hoc only"; exit 1; fi
          spctl --assess --type execute -v "$app" 2>&1 || echo "spctl refuses the bundle, as documented for an unnotarized app"

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/release_guard.py stage windows dist/Windows stage
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path stage/* -DestinationPath "release/LumaSuite-${{ github.ref_name }}-windows-x86_64.zip" -Force

      - name: Package macOS release asset
        if: runner.os == 'macOS'
        run: |
          python tools/release_guard.py stage macos dist/macOS stage
          mkdir -p release
          zip_name="release/LumaSuite-${{ github.ref_name }}-macos-${{ matrix.mac_arch }}.zip"
          ditto -c -k --sequesterRsrc stage "$zip_name"

      - name: Verify the distributed macOS zip is arm64 only
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_macho_arch.py --zip release/LumaSuite-*-macos-arm64.zip --expect arm64

      # The package as it will be distributed, judged by this product's own inspector, and then
      # started: "PyInstaller completed successfully" is not evidence that anything runs. The smoke
      # test extracts the zip and asks the packaged application for its version, its pages and its
      # licence texts. The version it must report is read from lumaserver.py.
      - name: Inspect the distributed package
        shell: bash
        env:
          RUN_REF_TYPE: ${{ github.ref_type }}
          RUN_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip="$(find release -maxdepth 1 -name 'LumaSuite-*.zip' | head -1)"
          test -n "$zip" || { echo "::error::no release archive found"; exit 1; }
          if [ "$RUN_REF_TYPE" = "tag" ]; then
            python tools/inspect_release.py "$zip" --version "$RUN_REF_NAME"
          else
            # A branch push or a dispatch is a diagnostic build and can never publish. Its archive is
            # named for the branch, which is not an identity, so it is inspected under the diagnostic
            # name the inspector accepts, with exactly the same content checks.
            case "${{ runner.os }}" in
              macOS) tail="macos-arm64.zip" ;;
              *)     tail="windows-x86_64.zip" ;;
            esac
            mkdir -p diag-inspect
            cp "$zip" "diag-inspect/LumaSuite-ci-diagnostic-$tail"
            version="$(python -c "import sys; sys.path.insert(0, 'tools'); import release_guard; print('v' + release_guard.app_version())")"
            python tools/inspect_release.py "diag-inspect/LumaSuite-ci-diagnostic-$tail" --version "$version-diag1" --diagnostic
          fi

      - name: Smoke-test the packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          zip="$(find release -maxdepth 1 -name 'LumaSuite-*.zip' | head -1)"
          rm -rf smoke-extract && mkdir smoke-extract
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -x -k "$zip" smoke-extract
            exe="smoke-extract/LumaSuite.app/Contents/MacOS/LumaSuite"
          else
            python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('smoke-extract')" "$zip"
            exe="smoke-extract/LumaSuite.exe"
          fi
          test -e "$exe" || { echo "::error::the packaged executable is not in the zip"; exit 1; }
          python tests/smoke_packaged.py "$exe"

      - name: Upload packaged release asset
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.artifact_name }}
          path: release/*
          if-no-files-found: error

  # Creates a DRAFT release from the packaged assets. Nothing is published: a person inspects the draft
  # and its SHA256SUMS.txt and publishes it deliberately. The job runs only when the identity guard said
  # this is exactly this product's release tag.
  publish-release:
    if: needs.identity.outputs.publishable == 'true'
    needs: [identity, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Inspect the packages (fails closed)
        shell: bash
        run: python3 tools/release_guard.py inspect release-assets

      - name: Write SHA256SUMS.txt from the final bytes
        shell: bash
        run: python3 tools/release_guard.py checksums release-assets

      - name: Create the DRAFT release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --title "LumaSuite ${RELEASE_TAG}" --notes-file RELEASE_NOTES.md \
            release-assets/*
